[package]
edition                = "2021"
name                   = "magics-cli"
description            = "Command-line interface and configuration management for the Magics planner"
version                = "0.1.0"
authors                = ["Simon Norup Krammer <simon.krammer@hotmail.com>"]
license                = "MIT OR Apache-2.0"

[features]
default = ["ui"]
ui = ["magics-bevy"]

[dependencies]
# Core dependencies for all modes
magics-core = { path = "../magics-core" }
# Optional UI dependency
magics-bevy = { path = "../magics-bevy", optional = true }

# CLI and configuration dependencies
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "1.0"
anyhow = "1.0"
colored = "2.1"
atty = "0.2"
log = "0.4"
env_logger = "0.10"
gbp_config = { path = "../../crates/gbp_config" }
gbp_environment = { path = "../../crates/gbp_environment" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bat = "0.24"
