[package]
edition                = "2021"
name                   = "magics-bevy"
description            = "Bevy-specific UI and rendering for the Magics planner"
version                = "0.1.0"
authors                = ["Simon Norup Krammer <simon.krammer@hotmail.com>"]
license                = "MIT OR Apache-2.0"

[dependencies]
# Depend on our core crate
magics-core = { path = "../magics-core" }
# No longer depend on magics-cli to break cycle

# Bevy and related dependencies
bevy = "0.13"
bevy-inspector-egui = "0.23.2"
bevy_egui = "0.26.0"
egui_dock = "0.11.4"
egui_tiles = "0.7.2"
bevy_rand = "0.6"
bevy_prng = "0.6"
bevy_mod_picking = "0.18"
iyes_perf_ui = { git = "https://github.com/IyesGames/iyes_perf_ui", branch = "main" }
bevy_asset_loader = "0.20"
bevy_mod_debugdump = "0.10.0"
bevy_image_export = "0.10"
bevy_infinite_grid = { git = "https://github.com/AU-Master-Thesis/bevy_infinite_grid", branch = "bevy-v0.13.0" }
bevy_more_shapes = { git = "https://github.com/AU-Master-Thesis/bevy_more_shapes", branch = "bevy-v0.13.0" }
bevy_dev_console = { git = "https://github.com/doonv/bevy_dev_console.git", version = "0.1.0" }
leafwing-input-manager = "0.13.3"
egui_extras = { version = "0.26.2", features = ["all_loaders"] }
egui_plot = "0.26"
egui_graphs = "0.19.0"
bevy_notify = { path = "../../crates/bevy_notify" }
bevy_fullscreen = { path = "../../crates/bevy_fullscreen" }
bevy_touchpad = { path = "../../crates/bevy_touchpad" }

# Other dependencies needed for the UI
mimalloc = "0.1.42"
image = { version = "0.25", default-features = false, features = ["png"] }
catppuccin = "1.4.0"
dark-light = "1.1.1"
bevy_dev = "0.3.0"
termsize = "0.1.6"
derive_more = "0.99.17"

[features]
dev = ["bevy/dynamic_linking"]
dhat-heap = ["dep:dhat"]
dhat-ad-hoc = ["dep:dhat"]

[dependencies.dhat]
version = "0.3.3"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
open = "5.1"
bat = "0.24"
