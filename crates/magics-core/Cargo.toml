[package]
edition                = "2021"
name                   = "magics-core"
description            = "Core simulation logic for the Magics planner without UI dependencies"
version                = "0.1.0"
authors                = ["Simon Norup Krammer <simon.krammer@hotmail.com>"]
license                = "MIT OR Apache-2.0"

[dependencies]
# No longer depend on magics-cli to break cycle

# Core dependencies from original magics
percentage              = { path = "../../crates/percentage" }
angle                   = { path = "../../crates/angle" }
unit_interval           = { path = "../../crates/unit_interval" }
min_len_vec             = { path = "../../crates/min_len_vec" }
gbp_linalg              = { path = "../../crates/gbp_linalg" }
gbp_multivariate_normal = { path = "../../crates/gbp_multivariate_normal" }
units                   = { path = "../../crates/units" }
repeating_array         = { path = "../../crates/repeating_array" }
seq                     = { path = "../../crates/seq" }
interleave_evenly       = { path = "../../crates/interleave_evenly" }
gbp_schedule            = { path = "../../crates/gbp_schedule" }
env_to_png              = { path = "../../crates/env_to_png" }
gbp_config              = { path = "../../crates/gbp_config" }
gbp_environment         = { path = "../../crates/gbp_environment" }
gbp_global_planner      = { path = "../../crates/gbp_global_planner" }

# Dependencies for non-UI functionality
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
rand_chacha = { version = "0.3", features = ["simd"] }
ndarray = "0.15"
ndarray-inverse = "0.1.9"
itertools = "0.11"
toml = "0.8"
strum = "0.26"
strum_macros = "0.26"
typed_floats = "1.0"
delegate = "0.12"
derive_more = "0.99"
rrt = { git = "https://github.com/AU-Master-Thesis/rrt", branch = "main" }
parry2d = { git = "https://github.com/AU-Master-Thesis/parry", branch = "feat/bevy-conversions", features = ["serde-serialize"] }
parry3d = { git = "https://github.com/AU-Master-Thesis/parry", branch = "feat/bevy-conversions", features = ["serde-serialize"] }
struct_iterable = "0.1"
smol_str = "0.2"
indexmap = "2.2"
log = "0.4"
env_logger = "0.10"
better-panic = "0.3.0"
colored = "2.1"
chrono = "0.4"
once_cell = "1.19"
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
# Features for core functionality
visualization-obstacle-factors = []
headless = []

[[bin]]
name = "magics-headless"
path = "src/bin/magics-headless.rs"

[dev-dependencies]
pretty_assertions = "1.4"
approx = "0.5"
