[workspace]
resolver = "2"

members = [
    "crates/magics-core",
    "crates/magics-bevy",
    "crates/magics-cli",
]

[workspace.package]
edition       = "2021"
version       = "2.0.0"
authors       = ["Simon Norup Krammer <simon.krammer@hotmail.com>"]
repository    = "https://github.com/AU-Master-Thesis/magics"
rust-version  = "1.76"
license       = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy              = { version = "0.13.0" }
bevy_rand         = { version = "0.8.0" } 
bevy_prng         = { version = "0.8.0" }
parry3d           = { git = "https://github.com/AU-Master-Thesis/parry", branch = "feat/bevy-conversions", features = ["serde-serialize"] }
parry2d           = { git = "https://github.com/AU-Master-Thesis/parry", branch = "feat/bevy-conversions", features = ["serde-serialize"] }
rrt               = { git = "https://github.com/AU-Master-Thesis/rrt", branch = "main" }
struct_iterable   = "0.1"
toml              = "0.8.8"
thiserror         = "1.0.50"
anyhow            = "1.0.75"
clap              = "4.4.11"
itertools         = "0.11.0"
ndarray           = "0.15.6"
num-traits        = "0.2.17"
ron               = "0.8.1"
strum             = "0.25.0"
strum_macros      = "0.25.3"
typed_floats      = "1.0.0"
delegate          = "0.12.0"
derive_more       = "0.99.17"
pretty_assertions = "1.4.0"
serde             = { version = "1.0", features = ["derive"] }
serde_json        = "1.0"
serde_yaml        = "0.9"
rand              = "0.8.5"
rand_chacha       = { version = "0.3.1", features = ["simd"] }
petgraph          = "0.6"
ndarray-inverse   = "0.1.9"
glob              = "0.3.1"
better-panic      = "0.3.0"
tap               = "1.0.1"
ringbuf           = "0.3.3"
termsize          = "0.1.6"
paste             = "1.0.14"
egui_plot         = "0.26"
egui_graphs       = "0.19.0"
colored           = "2.1.0"
chrono            = "0.4.37"
dark-light        = "1.1.1"
bevy_dev          = "0.3.0"
once_cell         = "1.19.0"
smol_str          = "0.2.1"
fastrand          = "2.0.2"
typed-builder     = "0.18.2"
atty              = "0.2.14"
dhat              = "0.3.3"
indexmap          = "2.2.6"
colorgrad         = "0.6.2"
ordered-float     = "4.2.0"
mimalloc          = "0.1.42"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package.bevy_internal]
opt-level = 3
debug = false

[profile.release]
opt-level = 3

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
pedantic = "warn"

# Magics repository root package
[package]
name                   = "magics-root"
description            = "Root package for Magics planner repository"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
repository.workspace   = true
rust-version.workspace = true
license.workspace      = true
publish                = false

[dependencies]
# Add no dependencies here
