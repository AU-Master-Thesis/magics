environment_image = "empty"
environment       = "./config/scenarios/CircleExperimentSmall/environment.yaml"
formation_group   = "./config/scenarios/CircleExperimentSmall/formation.yaml"

[visualisation.height]
objects    = 0.5
height-map = 1.0

[visualisation.draw]
robots                             = true
communication-graph                = false
predicted-trajectories             = true
waypoints                          = false
uncertainty                        = false
paths                              = true
communication-radius               = false
obstacle-factors                   = false
tracking                           = false
interrobot-factors                 = false
interrobot-factors-safety-distance = false
generated-map                      = true
sdf                                = false
robot-colliders                    = false
environment-colliders              = false
robot-robot-collisions             = true
robot-environment-collisions       = true

[visualisation.uncertainty]
max-radius = 2.5
scale      = 300.0

[interaction]
ui-focus-cancels-inputs = true
default-cam-distance    = 75.0

[gbp]
sigma-pose-fixed        = 0.0000000000000010000000036274937
sigma-factor-dynamics   = 0.10000000149011612
sigma-factor-interrobot = 0.0005000000237487257
sigma-factor-obstacle   = 0.004999999888241291
sigma-factor-tracking   = 0.10000000149011612
lookahead-multiple      = 3
variables               = 10 # not used!

[gbp.tracking]
switch-padding      = 1.0
attraction-distance = 2.0
schedule = "interleave-evenly"


[gbp.iteration-schedule]
internal = 25
external = 15
schedule = "interleave-evenly"

[gbp.factors-enabled]
dynamic    = true
interrobot = true
obstacle   = true
tracking   = false

[robot]
planning-horizon                       = 2.0
target-speed                           = 10.0
inter-robot-safety-distance-multiplier = 2.5

[robot.radius]
min = 1.0
max = 1.0

[robot.communication]
radius       = 20.0
failure-rate = 0.0

[simulation]
max-time                                  = 10000.0
time-scale                                = 5.0
manual-step-factor                        = 1
hz                                        = 10.0
prng-seed                                 = 2
pause-on-spawn                            = false
pause-on-load                             = true
despawn-robot-when-final-waypoint-reached = false
exit-application-on-scenario-finished     = false
# The verbosity level of logging. Options: "error", "warn", "info", "debug", "trace", "off"
log-level                                 = "info"

[rrt]
max-iterations       = 1000000
step-size            = 0.5
collision-radius     = 0.10000000149011612
neighbourhood-radius = 10.0

[rrt.smoothing]
enabled        = true
max-iterations = 100
step-size      = 1.0

[graphviz]
export-location = "./assets/export/"

[graphviz.interrobot.active]
style = "dashed"
len   = 8.0
color = "red"

[graphviz.interrobot.inactive]
style = "dashed"
len   = 8.0
color = "gray"

[manual]
timesteps-per-step = 1

[debug.on-variable-clicked]
obstacle   = false
dynamic    = false
interrobot = false
tracking   = false
variable   = false
inbox      = false
