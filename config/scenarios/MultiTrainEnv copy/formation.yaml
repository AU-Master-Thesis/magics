# Circle scenario
- repeat:
    every:
      secs: 8
      nanos: 0
    times: !finite 1
  delay:
    secs: 0
    nanos: 0
  name: "Cicle_scenario"
  robots: 10
  planning-strategy: only-local
  initial-position: # Using single 'shape' for backward compatibility example
    shape: !circle
      radius: 12.0
      center:
        x: 0.690476
        y: 0.5
    placement-strategy: equal
  waypoints: # Using single 'shape' for backward compatibility example
    - shape: !circle
        radius: 12.0
        center:
          x: 0.690476
          y: 0.5
      projection-strategy: cross
  waypoint-reached-when-intersects:
    distance: robot-radius
    intersects-with: horizon
  finished-when-intersects:
    distance: robot-radius
    intersects-with: current

# Doorway scenario
