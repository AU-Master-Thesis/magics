formations:
- repeat:
    every:
      secs: 10
      nanos: 0
    times: !finite 1
  delay:
    secs: 0
    nanos: 0
  robots: 5 # Spawn 5 robots
  planning-strategy: only-local
  initial-position:
    shape: !random-square
      p1: { x: 0.2, y: 0.2 } # Bottom-left area
      p2: { x: 0.4, y: 0.4 }
      min_distance: 1.5 # Minimum distance between spawned robots
    placement-strategy: !random { attempts: 1 }
  # No waypoints defined, only goal-position
  goal-position:
  - shape: !random-square
      p1: { x: 0.6, y: 0.6 } # Top-right area for goals
      p2: { x: 0.8, y: 0.8 }
      min_distance: 1.5
    projection-strategy: identity
  - shape: !random-square
      p1: { x: 0.2, y: 0.6 } # Top-left area for goals
      p2: { x: 0.4, y: 0.8 }
      min_distance: 1.5
    projection-strategy: identity
  waypoint-reached-when-intersects:
    distance: robot-radius
    intersects-with: horizon
  finished-when-intersects:
    distance: robot-radius
    intersects-with: current
